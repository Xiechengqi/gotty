name: Validate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: cd js && npm ci
      - name: Go tests and vet
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go vet ./...
          go test -race ./...
      # UI/component/browser tests run outside GitHub Actions; see ../AGENTS.md.
      - run: make typecheck
      - name: Build frontend and verify committed assets
        run: |
          make assets
          ./scripts/check-frontend-assets.sh
