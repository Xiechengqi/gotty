name: Validate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: cd js && npm ci
      - name: Go tests and vet
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go vet ./...
          go test -race ./...
      - run: make typecheck test-js
      - name: Build frontend and verify committed assets
        run: |
          make assets
          ./scripts/check-frontend-assets.sh
      - name: Install browser and transfer tools
        run: |
          cd js && npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y lrzsz
      - run: make test-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts
          path: js/test-results/
